# Bot Telegram d'Alexis : lit les messages toutes les ~5 minutes et met à jour les images / data.json du site.
# (GitHub peut parfois décaler le lancement de quelques minutes.)
name: Bot Telegram Alexis

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-telegram
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Lire les messages du bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_ID: ${{ secrets.TELEGRAM_ALLOWED_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/alexis_bot.py

      - name: Enregistrer les changements
        run: |
          git config user.name "alexis-bot"
          git config user.email "alexis-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Bot : mise à jour du site"
            git push
          fi
